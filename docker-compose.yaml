services:
  backend1:
    image: ghcr.io/nabindevx/url-shortener/backend:latest
    container_name: backend_1
    ports:
      - "3333:8001"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      MONGODB_URI: ${MONGODB_URI}
      DB_NAME: ${DB_NAME}
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      USER_SECRET_ACCESS_TOKEN: ${USER_SECRET_ACCESS_TOKEN}
      USER_SECRET_REFRESH_TOKEN: ${USER_SECRET_REFRESH_TOKEN}
      ACCESS_TOKEN_EXPIRY: ${ACCESS_TOKEN_EXPIRY}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY}
    networks:
      - app-network

  backend2:
    image: ghcr.io/nabindevx/url-shortener/backend:latest
    container_name: backend_2
    ports:
      - "4444:8001"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      MONGODB_URI: ${MONGODB_URI}
      DB_NAME: ${DB_NAME}
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      USER_SECRET_ACCESS_TOKEN: ${USER_SECRET_ACCESS_TOKEN}
      USER_SECRET_REFRESH_TOKEN: ${USER_SECRET_REFRESH_TOKEN}
      ACCESS_TOKEN_EXPIRY: ${ACCESS_TOKEN_EXPIRY}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY}
    networks:
      - app-network

  backend3:
    image: ghcr.io/nabindevx/url-shortener/backend:latest
    container_name: backend_3
    ports:
      - "5555:8001"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      MONGODB_URI: ${MONGODB_URI}
      DB_NAME: ${DB_NAME}
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      USER_SECRET_ACCESS_TOKEN: ${USER_SECRET_ACCESS_TOKEN}
      USER_SECRET_REFRESH_TOKEN: ${USER_SECRET_REFRESH_TOKEN}
      ACCESS_TOKEN_EXPIRY: ${ACCESS_TOKEN_EXPIRY}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY}
    networks:
      - app-network

  frontend:
    image: ghcr.io/nabindevx/url-shortener/frontend:latest
    container_name: frontend
    ports:
      - "5000:5173"
    environment:
      NODE_ENV: ${NODE_ENV}
      VITE_API_PREFIX: ${VITE_API_PREFIX}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    depends_on:
      - backend1
      - backend2
      - backend3
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
