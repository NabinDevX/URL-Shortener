services:
  backend:
    image: ghcr.io/nabindevx/url-shortener/backend:latest
    container_name: backend
    restart: unless-stopped
    ports:
      - "3333:8001"
    volumes:
      - extension-dist:/app/public/extension:ro
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      MONGODB_URI: ${MONGODB_URI}
      DB_NAME: ${DB_NAME}
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      USER_SECRET_ACCESS_TOKEN: ${USER_SECRET_ACCESS_TOKEN}
      USER_SECRET_REFRESH_TOKEN: ${USER_SECRET_REFRESH_TOKEN}
      ACCESS_TOKEN_EXPIRY: ${ACCESS_TOKEN_EXPIRY}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8001/document"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

  frontend:
    image: ghcr.io/nabindevx/url-shortener/frontend:latest
    container_name: frontend
    restart: unless-stopped
    ports:
      - "5000:5173"
    volumes:
      - extension-dist:/app/extension
    environment:
      NODE_ENV: ${NODE_ENV}
      VITE_API_PREFIX: ${VITE_API_PREFIX}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

volumes:
  extension-dist:

networks:
  app-network:
    driver: bridge
