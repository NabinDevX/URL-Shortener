services:
  backend:
    image: ${REGISTRY:-ghcr.io}/${REPO_LOWER}/backend:latest
    container_name: backend
    restart: unless-stopped
    ports:
      - "8000:${PORT}"
    env_file:
      - ./apps/backend/.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT}
      MONGODB_URI: ${MONGODB_URI}
      DB_NAME: ${DB_NAME}
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      USER_SECRET_ACCESS_TOKEN: ${USER_SECRET_ACCESS_TOKEN}
      USER_SECRET_REFRESH_TOKEN: ${USER_SECRET_REFRESH_TOKEN}
      ACCESS_TOKEN_EXPIRY: ${ACCESS_TOKEN_EXPIRY}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY}
      NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID}
      GOOGLE_WEB_CLIENT_SECRET: ${GOOGLE_WEB_CLIENT_SECRET}
      NEXT_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_ANDROID_CLIENT_ID}
      NEXT_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_IOS_CLIENT_ID}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL}
      OTP_EMAIL_IN_NON_PRODUCTION: ${OTP_EMAIL_IN_NON_PRODUCTION:-false}
      PRODUCTION_DOMAIN: ${PRODUCTION_DOMAIN:-urltinier.app}
      API_KEY_RATE_LIMIT_REQUESTS: ${API_KEY_RATE_LIMIT_REQUESTS}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOKI_HOST: ${LOKI_HOST}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:' + process.env.PORT + '/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

  frontend:
    image: ${REGISTRY:-ghcr.io}/${REPO_LOWER}/frontend:latest
    container_name: frontend
    restart: unless-stopped
    ports:
      - "5000:3000"
    env_file:
      - ./apps/web/.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID}
      NEXT_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_ANDROID_CLIENT_ID}
      NEXT_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_IOS_CLIENT_ID}
      VITE_API_PREFIX: ${VITE_API_PREFIX}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
