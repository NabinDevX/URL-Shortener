services:
  frontend:
    image: ghcr.io/nabindevx/url-shortener/frontend:latest
    container_name: frontend
    volumes:
      - shared-data:/app/packages/extension/dist
    ports:
      - "5000:5173"
    environment:
      NODE_ENV: ${NODE_ENV}
      VITE_API_PREFIX: ${VITE_API_PREFIX}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    networks:
      - app-network

  backend1:
    image: ghcr.io/nabindevx/url-shortener/backend:latest
    container_name: backend_1
    volumes:
      - shared-data:/app/downloads/dist:ro
    ports:
      - "3333:8001"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      MONGODB_URI: ${MONGODB_URI}
      DB_NAME: ${DB_NAME}
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      USER_SECRET_ACCESS_TOKEN: ${USER_SECRET_ACCESS_TOKEN}
      USER_SECRET_REFRESH_TOKEN: ${USER_SECRET_REFRESH_TOKEN}
      ACCESS_TOKEN_EXPIRY: ${ACCESS_TOKEN_EXPIRY}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL}
    depends_on:
      - frontend
    networks:
      - app-network

volumes:
  shared-data:

networks:
  app-network:
    driver: bridge
