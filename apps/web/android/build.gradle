// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Ensure subprojects that expose an Android `android` extension use the
// project keystore for debug builds so local dev and CI share the same key.
subprojects {
    afterEvaluate { proj ->
        if (proj.hasProperty('android')) {
            try {
                def keystoreFile = rootProject.file('app/urltinier.keystore')
                if (keystoreFile.exists()) {
                    proj.android.signingConfigs {
                        debug {
                            storeFile keystoreFile
                            storePassword 'urltinier123'
                            keyAlias 'urltinier'
                            keyPassword 'urltinier123'
                        }
                    }
                    proj.android.buildTypes.debug.signingConfig = proj.android.signingConfigs.debug
                }
            } catch(Exception e) {
                // ignore projects that don't support signingConfigs
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
