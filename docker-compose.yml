version: '3.8'

services:
  backend1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_1
    ports:
      - "3333:8001"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      MONGODB_URI: ${MONGODB_URI}
      DB_NAME: ${DB_NAME}
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      CLIENT_ID: ${CLIENT_ID}
      USER_SECRET_ACCESS_TOKEN: ${USER_SECRET_ACCESS_TOKEN}
      USER_SECRET_REFRESH_TOKEN: ${USER_SECRET_REFRESH_TOKEN}
      ACCESS_TOKEN_EXPIRY: ${ACCESS_TOKEN_EXPIRY}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY}
    networks:
      - app-network

  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_2
    ports:
      - "4444:8001"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      MONGODB_URI: ${MONGODB_URI}
      DB_NAME: ${DB_NAME}
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      CLIENT_ID: ${CLIENT_ID}
      USER_SECRET_ACCESS_TOKEN: ${USER_SECRET_ACCESS_TOKEN}
      USER_SECRET_REFRESH_TOKEN: ${USER_SECRET_REFRESH_TOKEN}
      ACCESS_TOKEN_EXPIRY: ${ACCESS_TOKEN_EXPIRY}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY}
    networks:
      - app-network

  backend3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_3
    ports:
      - "5555:8001"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      MONGODB_URI: ${MONGODB_URI}
      DB_NAME: ${DB_NAME}
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      CLIENT_ID: ${CLIENT_ID}
      USER_SECRET_ACCESS_TOKEN: ${USER_SECRET_ACCESS_TOKEN}
      USER_SECRET_REFRESH_TOKEN: ${USER_SECRET_REFRESH_TOKEN}
      ACCESS_TOKEN_EXPIRY: ${ACCESS_TOKEN_EXPIRY}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY}
    networks:
      - app-network

  backend4:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_4
    ports:
      - "6666:8001"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      MONGODB_URI: ${MONGODB_URI}
      DB_NAME: ${DB_NAME}
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      CLIENT_ID: ${CLIENT_ID}
      USER_SECRET_ACCESS_TOKEN: ${USER_SECRET_ACCESS_TOKEN}
      USER_SECRET_REFRESH_TOKEN: ${USER_SECRET_REFRESH_TOKEN}
      ACCESS_TOKEN_EXPIRY: ${ACCESS_TOKEN_EXPIRY}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY}
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      VITE_API_URL: ${VITE_API_URL}
    depends_on:
      - backend1
      - backend2
      - backend3
      - backend4
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
