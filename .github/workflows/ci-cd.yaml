name: CI/CD Deployment (GHCR Pull)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    uses: ./.github/workflows/android.yaml
    secrets: inherit

  build-extension:
    uses: ./.github/workflows/extension.yaml
    secrets: inherit

  # 1️⃣ Build and Push to GHCR
  build-and-push:
    needs: [build-android, build-extension]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download Android build
        uses: actions/download-artifact@v8.0.1
        with:
          name: android-apk
          path: .artifacts/android

      - name: Download Extension build
        uses: actions/download-artifact@v8.0.1
        with:
          name: extension-zip
          path: .artifacts/extension

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore downloaded artifacts into public folders
        run: |
          mkdir -p apps/web/public/apk apps/web/public/extension
          mkdir -p apps/backend/public/apk apps/backend/public/extension

          ANDROID_APK=$(find .artifacts/android -name "*.apk" | head -n 1)
          EXTENSION_ZIP=$(find .artifacts/extension -name "*.zip" | head -n 1)

          if [ -z "$ANDROID_APK" ] || [ -z "$EXTENSION_ZIP" ]; then
            echo "❌ Missing one or more build artifacts"
            find .artifacts -maxdepth 3 -type f
          fi

          cp "$ANDROID_APK" apps/web/public/apk/urltinier.apk || true
          cp "$ANDROID_APK" apps/backend/public/apk/urltinier.apk || true
          cp "$EXTENSION_ZIP" apps/web/public/extension/urltinier.zip || true
          cp "$EXTENSION_ZIP" apps/backend/public/extension/urltinier.zip || true

          test -s apps/web/public/apk/urltinier.apk || true
          test -s apps/web/public/extension/urltinier.zip || true
          test -s apps/backend/public/apk/urltinier.apk || true
          test -s apps/backend/public/extension/urltinier.zip || true

      # 🧩 Convert repo name to lowercase for GHCR
      - name: Prepare lowercase image names
        id: names
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_LOWER=$REPO_LOWER" >> $GITHUB_ENV
          echo "BACKEND_IMAGE_NAME=$REPO_LOWER/backend" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE_NAME=$REPO_LOWER/frontend" >> $GITHUB_ENV

      # 🔐 Login to GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN_GITHUB }}

      # 🏗️ Build and Push Backend
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest

      # 🏗️ Build and Push Frontend
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
          build-args: |
            NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
            NEXT_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}

  # 2️⃣ Deploy on VM (Pull Images and Run Containers)
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Prepare lowercase repo name
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Create .env file
        run: |
          cat > .env << EOF
          REGISTRY=${{ env.REGISTRY }}
          REPO_LOWER=${{ env.REPO_LOWER }}
          NODE_ENV=${{ secrets.NODE_ENV }}
          PORT=${{ secrets.PORT }}
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          DB_NAME=${{ secrets.DB_NAME }}
          REDIS_URL=${{ secrets.REDIS_URL }}
          CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
          USER_SECRET_ACCESS_TOKEN=${{ secrets.USER_SECRET_ACCESS_TOKEN }}
          USER_SECRET_REFRESH_TOKEN=${{ secrets.USER_SECRET_REFRESH_TOKEN }}
          ACCESS_TOKEN_EXPIRY=${{ secrets.ACCESS_TOKEN_EXPIRY }}
          REFRESH_TOKEN_EXPIRY=${{ secrets.REFRESH_TOKEN_EXPIRY }}
          NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          NEXT_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_SECRET=${{ secrets.GOOGLE_WEB_CLIENT_SECRET }}
          BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL=${{ secrets.BREVO_SENDER_EMAIL }}
          VITE_API_PREFIX=${{ secrets.VITE_API_PREFIX }}
          VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          CAPACITOR_SERVER_URL=${{ secrets.CAPACITOR_SERVER_URL }}
          RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}
          LOG_LEVEL=${{ secrets.LOG_LEVEL }}
          LOKI_HOST=${{ secrets.LOKI_HOST }}
          OTP_EMAIL_IN_NON_PRODUCTION=${{ secrets.OTP_EMAIL_IN_NON_PRODUCTION }}
          PRODUCTION_DOMAIN=${{ secrets.PRODUCTION_DOMAIN }}
          API_KEY_RATE_LIMIT_REQUESTS=${{ secrets.API_KEY_RATE_LIMIT_REQUESTS }}
          RATE_LIMIT_WINDOW_MS=${{ secrets.RATE_LIMIT_WINDOW_MS }}
          RATE_LIMIT_MAX_REQUESTS=${{ secrets.RATE_LIMIT_MAX_REQUESTS }}
          EOF

      - name: Ensure target directory exists on VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: mkdir -p ~/URL-Shortener

      - name: Copy .env file to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: ".env"
          target: "~/URL-Shortener/"

      - name: Copy docker-compose.yaml to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "docker-compose.yaml"
          target: "~/URL-Shortener/"

      - name: Login to GHCR on VM
        uses: appleboy/ssh-action@v1.0.0
        env:
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: TOKEN_GITHUB
          script: |
            echo "$TOKEN_GITHUB" | sudo docker login ghcr.io \
              -u ${{ github.actor }} \
              --password-stdin || {
                echo "❌ Docker login failed"
                exit 1
              }

      - name: Stop old containers and free disk space
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/URL-Shortener
            sudo docker compose down --remove-orphans || true
            sudo docker container prune -f || true
            sudo docker image prune -af || true
            sudo docker builder prune -af || true

      - name: Pull latest images
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: REPO_LOWER,REGISTRY
          script: |
            cd ~/URL-Shortener
            echo "Pulling images: $REGISTRY/$REPO_LOWER/backend:latest and $REGISTRY/$REPO_LOWER/frontend:latest"
            sudo docker pull $REGISTRY/$REPO_LOWER/backend:latest || { echo "❌ Failed to pull backend image"; exit 1; }
            sudo docker pull $REGISTRY/$REPO_LOWER/frontend:latest || { echo "❌ Failed to pull frontend image"; exit 1; }

      - name: Start new containers
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/URL-Shortener
            sudo docker compose up -d || { echo "❌ Failed to start containers"; exit 1; }

      - name: Health check
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sleep 60
            sudo docker ps

            BACKEND_HEALTHY=false
            FRONTEND_HEALTHY=false

            echo "🔍 Checking Backend Health..."
            if curl -s -f http://localhost:8000/health > /dev/null; then
              echo "✅ Backend is healthy"
              BACKEND_HEALTHY=true
            else
              echo "❌ Backend health check failed"
            fi

            echo "🔍 Checking Frontend Health..."
            if curl -s -f http://localhost:5000/ > /dev/null; then
              echo "✅ Frontend is healthy"
              FRONTEND_HEALTHY=true
            else
              echo "❌ Frontend health check failed"
            fi

            if [ "$BACKEND_HEALTHY" = false ] || [ "$FRONTEND_HEALTHY" = false ]; then
              echo "❌ Health checks failed"
              exit 1
            fi

      - name: Cleanup old images
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: sudo docker image prune -af --filter "until=24h" || true

      - name: Deployment complete
        run: echo "✅ Deployment complete!"
