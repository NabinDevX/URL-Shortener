name: CI/CD Deployment (GHCR Pull)

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io

jobs:
  # 1️⃣ Build and Push to GHCR
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # 🧩 Convert repo name to lowercase for GHCR
      - name: Prepare lowercase image names
        id: names
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_LOWER=$REPO_LOWER" >> $GITHUB_ENV
          echo "BACKEND_IMAGE_NAME=$REPO_LOWER/backend" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE_NAME=$REPO_LOWER/frontend" >> $GITHUB_ENV

      # 🔐 Login to GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN_GITHUB }}

      # 🏗️ Build and Push Backend
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest

      # 🏗️ Build and Push Frontend
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest

  # 2️⃣ Deploy on VM (Pull Images and Run Containers)
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 🧩 Prepare lowercase repo name for deploy too
      - name: Prepare lowercase repo name
        id: repo
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # 🚀 Deploy to VM via SSH
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            echo "🚀 Starting deployment on VM..."

            # Login to GHCR on VM
            echo "${{ secrets.TOKEN_GITHUB }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest images from GHCR (lowercase repo)
            docker pull ghcr.io/${{ env.REPO_LOWER }}/backend:latest
            docker pull ghcr.io/${{ env.REPO_LOWER }}/frontend:latest

            # Navigate to project directory
            cd URL-Shortener

            # Pull latest code (optional, if you want to keep code updated)
            git pull origin main

            # Stop old containers safely
            docker-compose down || true

            # Start containers
            docker-compose up -d --remove-orphans

            # Health check (optional)
            sleep 60

            # Verify running containers
            docker ps
            curl -f http://localhost:5000/health || echo "⚠️ Health check failed"

            # Cleanup old images
            docker image prune -f

            echo "✅ Deployment complete!"
