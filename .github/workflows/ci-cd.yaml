name: CI/CD Deployment (GHCR Pull)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 🔨 Build Mobile Apps (Android/iOS via Capacitor from Next.js web app)
  build-mobile:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: android
          - os: macos-latest
            platform: ios

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ========== ANDROID BUILD (Ubuntu) ==========
      - name: Setup Java for Android
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3
      - name: Cache Gradle
        if: matrix.platform == 'android'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.      properties') }}

      - name: Install Android Build Tools
        if: matrix.platform == 'android'
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Build Next.js for Android
        if: matrix.platform == 'android'
        env:
          NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          NEXT_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          NEXT_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          cd apps/web
          pnpm build || {
            echo "❌ Next.js build failed for Android"
            exit 1
          }

      - name: Sync Capacitor Android
        if: matrix.platform == 'android'
        run: |
          cd apps/web
          npx cap sync android || {
            echo "❌ Capacitor Android sync failed"
            exit 1
          }

      - name: Build Android APK
        if: matrix.platform == 'android'
        run: |
          mkdir -p apps/web/public/apk
          cd apps/web/android

          # Make gradlew executable
          chmod +x ./gradlew

          # Build APK
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName="1.0.${{ github.run_number }}" || {
            echo "❌ Gradle build failed"
            exit 1
          }

          # Copy APK (try release first, fallback to debug)
          TARGET_DIR="$(pwd)/../public/apk"
          mkdir -p "$TARGET_DIR"

          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then

            cp app/build/outputs/apk/release/app-release.apk "$TARGET_DIR/urltinier.apk"

          elif [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then

            cp app/build/outputs/apk/debug/app-debug.apk "$TARGET_DIR/urltinier.apk"

          else
            echo "❌ No APK file found after build"
            find . -name "*.apk"
            exit 1
          fi

      - name: Verify Android APK output
        if: matrix.platform == 'android'
        run: test -f apps/web/public/apk/urltinier.apk || (echo "❌ APK verification failed" && exit 1)

      # ========== iOS BUILD (macOS) ==========
      - name: Setup Xcode
        if: matrix.platform == 'ios'
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

          xcodebuild -version

      - name: Build Next.js for iOS
        if: matrix.platform == 'ios'
        env:
          NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          NEXT_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          NEXT_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          cd apps/web
          pnpm build || {
            echo "❌ Next.js build failed for iOS"
            exit 1
          }

      - name: Sync Capacitor iOS
        if: matrix.platform == 'ios'
        run: |
          cd apps/web
          npx cap sync ios || {
            echo "❌ Capacitor iOS sync failed"
            exit 1
          }

      - name: Install CocoaPods
        if: matrix.platform == 'ios'
        run: |
          cd apps/web/ios/App

          sudo gem install cocoapods

          pod install --repo-update || {
            echo "❌ pod install failed"
            exit 1
          }

      - name: Build iOS IPA
        if: matrix.platform == 'ios'
        run: |
          mkdir -p apps/web/public/ipa

          cd apps/web/ios/App

          # Verify workspace exists
          if [ ! -d "App.xcworkspace" ]; then
            echo "❌ App.xcworkspace not found"

            echo "Current directory:"
            pwd

            echo "Files:"
            ls -la

            exit 1
          fi

          # Build app
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            clean build || {
              echo "❌ Build failed"

              xcodebuild -workspace App.xcworkspace -list

              exit 1
            }

          # Archive app
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive || {
              echo "❌ Archive failed"
              exit 1
            }

          # Create export options
          cat > ExportOptions.plist << 'PLIST_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>

              <key>signingStyle</key>
              <string>automatic</string>

              <key>stripSwiftSymbols</key>
              <true/>
          </dict>
          </plist>
          PLIST_EOF

          # Export IPA
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa || {
              echo "❌ Export failed"

              echo "Likely causes:"
              echo "- Missing Apple Developer signing"
              echo "- Missing Team ID"
              echo "- Missing provisioning profile"

              exit 1
            }

          # Find IPA file safely
          IPA_FILE=$(find build/ipa -name "*.ipa" | head -n 1)

          if [ -z "$IPA_FILE" ]; then
            echo "❌ IPA file not found"

            find build -name "*.ipa"

            exit 1
          fi

          TARGET_DIR="$(pwd)/../../../public/ipa"

          mkdir -p "$TARGET_DIR"

          cp "$IPA_FILE" "$TARGET_DIR/urltinier.ipa"

          echo "✅ IPA copied successfully"

      - name: Verify iOS IPA output
        if: matrix.platform == 'ios'
        run: |
          test -f apps/web/public/ipa/urltinier.ipa || {
            echo "❌ iOS IPA verification failed"
            exit 1
          }

      - name: Upload mobile build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-builds-${{ matrix.platform }}
          path: apps/web/public/
          if-no-files-found: warn
          retention-days: 7

  # 🔧 Build Extension (Vite, Linux only)
  build-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Extension
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_API_PREFIX: ${{ secrets.VITE_API_PREFIX }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          mkdir -p apps/web/public/extension
          pnpm --filter @repo/extension build || {
            echo "❌ Extension build failed"
            exit 1
          }

          if [ ! -d "apps/extension/dist" ]; then
            echo "❌ Extension dist directory not found"
            exit 1
          fi

          cd apps/extension/dist
          zip -r ../../web/public/extension/urltinier.zip . -x "node_modules/*" ".git/*" || {
            echo "❌ Failed to create extension ZIP"
            exit 1
          }

      - name: Verify extension ZIP output
        run: test -f apps/web/public/extension/urltinier.zip || (echo "❌ Extension ZIP verification failed" && exit 1)

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-builds-extension
          path: apps/web/public/
          if-no-files-found: warn
          retention-days: 7

  # 1️⃣ Build and Push to GHCR
  build-and-push:
    needs: [build-mobile, build-extension]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Download all mobile build artifacts
      - name: Download Android build
        uses: actions/download-artifact@v4
        with:
          name: mobile-builds-android
          path: apps/web/public/
        continue-on-error: true

      - name: Download iOS build
        uses: actions/download-artifact@v4
        with:
          name: mobile-builds-ios
          path: apps/web/public/
        continue-on-error: true

      - name: Download Extension build
        uses: actions/download-artifact@v4
        with:
          name: mobile-builds-extension
          path: apps/web/public/
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure web public artifact folders exist
        run: |
          mkdir -p apps/web/public/apk
          mkdir -p apps/web/public/ipa
          mkdir -p apps/web/public/extension

      - name: Verify required artifacts exist
        run: |
          echo "📦 Checking artifacts..."
          if [ ! -f "apps/web/public/apk/urltinier.apk" ]; then
            echo "⚠️  Android APK not found (build may have failed or been skipped)"
          fi
          if [ ! -f "apps/web/public/ipa/urltinier.ipa" ]; then
            echo "⚠️  iOS IPA not found (build may have failed or been skipped)"
          fi
          if [ ! -f "apps/web/public/extension/urltinier.zip" ]; then
            echo "❌ Browser extension ZIP not found - this is required!"
            exit 1
          fi
          echo "✅ Artifact check complete"

      # 🧩 Convert repo name to lowercase for GHCR
      - name: Prepare lowercase image names
        id: names
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_LOWER=$REPO_LOWER" >> $GITHUB_ENV
          echo "BACKEND_IMAGE_NAME=$REPO_LOWER/backend" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE_NAME=$REPO_LOWER/frontend" >> $GITHUB_ENV

      # 🔐 Login to GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN_GITHUB }}

      # 🏗️ Build and Push Backend
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest

      # 🏗️ Build and Push Frontend
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
          build-args: |
            NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
            NEXT_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
            NEXT_PUBLIC_GOOGLE_IOS_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}

  # 2️⃣ Deploy on VM (Pull Images and Run Containers)
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Prepare lowercase repo name
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Create .env file
        run: |
          cat > .env << EOF
          REGISTRY=${{ env.REGISTRY }}
          REPO_LOWER=${{ env.REPO_LOWER }}
          NODE_ENV=${{ secrets.NODE_ENV }}
          PORT=${{ secrets.PORT }}
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          DB_NAME=${{ secrets.DB_NAME }}
          REDIS_URL=${{ secrets.REDIS_URL }}
          CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
          USER_SECRET_ACCESS_TOKEN=${{ secrets.USER_SECRET_ACCESS_TOKEN }}
          USER_SECRET_REFRESH_TOKEN=${{ secrets.USER_SECRET_REFRESH_TOKEN }}
          ACCESS_TOKEN_EXPIRY=${{ secrets.ACCESS_TOKEN_EXPIRY }}
          REFRESH_TOKEN_EXPIRY=${{ secrets.REFRESH_TOKEN_EXPIRY }}
          NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          NEXT_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          NEXT_PUBLIC_GOOGLE_IOS_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_SECRET=${{ secrets.GOOGLE_WEB_CLIENT_SECRET }}
          BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL=${{ secrets.BREVO_SENDER_EMAIL }}
          VITE_API_PREFIX=${{ secrets.VITE_API_PREFIX }}
          VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          CAPACITOR_SERVER_URL=${{ secrets.CAPACITOR_SERVER_URL }}
          RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}
          LOG_LEVEL=${{ secrets.LOG_LEVEL }}
          LOKI_HOST=${{ secrets.LOKI_HOST }}
          OTP_EMAIL_IN_NON_PRODUCTION=${{ secrets.OTP_EMAIL_IN_NON_PRODUCTION }}
          PRODUCTION_DOMAIN=${{ secrets.PRODUCTION_DOMAIN }}
          API_KEY_RATE_LIMIT_REQUESTS=${{ secrets.API_KEY_RATE_LIMIT_REQUESTS }}
          RATE_LIMIT_WINDOW_MS=${{ secrets.RATE_LIMIT_WINDOW_MS }}
          RATE_LIMIT_MAX_REQUESTS=${{ secrets.RATE_LIMIT_MAX_REQUESTS }}
          EOF

      - name: Ensure target directory exists on VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: mkdir -p ~/URL-Shortener

      - name: Copy .env file to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: ".env"
          target: "~/URL-Shortener/"

      - name: Copy docker-compose.yaml to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "docker-compose.yaml"
          target: "~/URL-Shortener/"

      - name: Login to GHCR on VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: TOKEN_GITHUB
          script: |
            echo "$TOKEN_GITHUB" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin || {
              echo "❌ Docker login failed"
              exit 1
            }

      - name: Pull latest images
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: REPO_LOWER,REGISTRY
          script: |
            cd ~/URL-Shortener
            echo "Pulling images: $REGISTRY/$REPO_LOWER/backend:latest and $REGISTRY/$REPO_LOWER/frontend:latest"
            sudo docker pull $REGISTRY/$REPO_LOWER/backend:latest || { echo "❌ Failed to pull backend image"; exit 1; }
            sudo docker pull $REGISTRY/$REPO_LOWER/frontend:latest || { echo "❌ Failed to pull frontend image"; exit 1; }

      - name: Stop old containers
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/URL-Shortener
            sudo docker compose down --remove-orphans || true

      - name: Start new containers
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/URL-Shortener
            sudo docker compose up -d || { echo "❌ Failed to start containers"; exit 1; }

      - name: Health check
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sleep 60
            sudo docker ps

            BACKEND_HEALTHY=false
            FRONTEND_HEALTHY=false

            echo "🔍 Checking Backend Health..."
            if curl -s -f http://localhost:8000/health > /dev/null; then
              echo "✅ Backend is healthy"
              BACKEND_HEALTHY=true
            else
              echo "❌ Backend health check failed"
            fi

            echo "🔍 Checking Frontend Health..."
            if curl -s -f http://localhost:3000/ > /dev/null; then
              echo "✅ Frontend is healthy"
              FRONTEND_HEALTHY=true
            else
              echo "❌ Frontend health check failed"
            fi

            if [ "$BACKEND_HEALTHY" = false ] || [ "$FRONTEND_HEALTHY" = false ]; then
              echo "❌ Health checks failed"
              exit 1
            fi

      - name: Cleanup old images
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: sudo docker image prune -af --filter "until=24h" || true

      - name: Deployment complete
        run: echo "✅ Deployment complete!"
