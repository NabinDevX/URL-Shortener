name: CI/CD Deployment (GHCR Pull)

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io

jobs:
  # 1️⃣ Build and Push to GHCR
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # 🧩 Convert repo name to lowercase for GHCR
      - name: Prepare lowercase image names
        id: names
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_LOWER=$REPO_LOWER" >> $GITHUB_ENV
          echo "BACKEND_IMAGE_NAME=$REPO_LOWER/backend" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE_NAME=$REPO_LOWER/frontend" >> $GITHUB_ENV

      # 🔐 Login to GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN_GITHUB }}

      # 🏗️ Build and Push Backend
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest

      # 🏗️ Build and Push Frontend
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest

  # 2️⃣ Deploy on VM (Pull Images and Run Containers)
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 🧩 Prepare lowercase repo name for deploy too
      - name: Prepare lowercase repo name
        id: repo
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # 🚀 Deploy to VM via SSH
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          script: |
            echo "🚀 Starting deployment on VM..."

            # Move to project directory
            cd /opt/URL-Shortner
            git fetch origin
            git reset --hard origin/main
            git clean -fd

            # Ensure clean state
            git reset --hard

            # Pull latest code (optional, if you want to keep code updated)
            git pull origin main

            # Login to GHCR on VM
            echo "${{ secrets.TOKEN_GITHUB }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest images from GHCR (lowercase repo)
            docker pull ghcr.io/${{ env.REPO_LOWER }}/backend:latest
            docker pull ghcr.io/${{ env.REPO_LOWER }}/frontend:latest
            ls -a

            # Stop old containers safely
            docker-compose down || true

            # Start containers with injected secrets
            NODE_ENV=${{ secrets.NODE_ENV }} \
            PORT=${{ secrets.PORT }} \
            MONGODB_URI=${{ secrets.MONGODB_URI }} \
            DB_NAME=${{ secrets.DB_NAME }} \
            REDIS_URL=${{ secrets.REDIS_URL }} \
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN }} \
            DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }} \
            CLIENT_ID=${{ secrets.CLIENT_ID }} \
            USER_SECRET_ACCESS_TOKEN=${{ secrets.USER_SECRET_ACCESS_TOKEN }} \
            USER_SECRET_REFRESH_TOKEN=${{ secrets.USER_SECRET_REFRESH_TOKEN }} \
            ACCESS_TOKEN_EXPIRY=${{ secrets.ACCESS_TOKEN_EXPIRY }} \
            REFRESH_TOKEN_EXPIRY=${{ secrets.REFRESH_TOKEN_EXPIRY }} \
            docker-compose up -d --remove-orphans

            # Verify running containers
            docker ps

            # Health check (optional)
            sleep 60
            curl -f http://localhost:5000/health || echo "⚠️ Health check failed"

            # Cleanup old images
            docker image prune -f

            echo "✅ Deployment complete!"
