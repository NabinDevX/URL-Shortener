name: Android APK Build

on:
  workflow_call:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Gradle
        uses: actions/cache@v4.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Android SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
          unzip commandlinetools-linux-12266719_latest.zip
          mv cmdline-tools latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build Next.js for Android
        env:
          NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          NEXT_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
        run: pnpm --filter @repo/web build

      - name: Sync Capacitor Android
        run: pnpm --filter @repo/web exec cap sync android

      - name: Build Android APK
        run: |
          mkdir -p apps/web/public/apk apps/backend/public/apk

          cd apps/web/android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon \
            -PversionCode=${{ github.run_number }} \
            -PversionName="1.0.${{ github.run_number }}"

          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ No APK file found"
            find . -name "*.apk"
          fi

          cp "$APK_FILE" ../public/apk/urltinier.apk || true
          cp "$APK_FILE" ../../backend/public/apk/urltinier.apk || true
          test -s ../public/apk/urltinier.apk || true
          test -s ../../backend/public/apk/urltinier.apk || true

      - name: Verify Android APK output
        run: |
          test -s apps/web/public/apk/urltinier.apk
          test -s apps/backend/public/apk/urltinier.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4.8.0
        with:
          name: android-apk
          path: apps/backend/public/apk/urltinier.apk
          if-no-files-found: error
          retention-days: 7
